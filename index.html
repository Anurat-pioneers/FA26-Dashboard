<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA26 Pipeline Overview</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent-aqua:    #1baf7a;
    --accent-orange:  #eb6834;
    --status-good:      #0ca30c;
    --status-good-text: #006300;
    --status-critical:  #d03b3b;
    --status-waitlist:  #d79a4a;
    --seq-350: #5598e7;
    --seq-450: #2a78d6;
    --seq-550: #1c5cab;
    --tile-good-bg:     #eafaea;
    --tile-critical-bg: #fceeee;
    --tile-aqua-bg:     #e9f9f2;
    --tile-warn-bg:     #fdf1e8;
    --tile-waitlist-bg: #fdf4e6;
    --hairline:       rgba(11,11,11,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent-aqua:    #199e70;
      --accent-orange:  #d95926;
      --status-good:      #0ca30c;
      --status-good-text: #0ca30c;
      --status-critical:  #e66767;
      --status-waitlist:  #d79a4a;
      --seq-350: #256abf;
      --seq-450: #3987e5;
      --seq-550: #5598e7;
      --tile-good-bg:     #14231a;
      --tile-critical-bg: #2a1c1c;
      --tile-aqua-bg:     #12241c;
      --tile-warn-bg:     #2a2016;
      --tile-waitlist-bg: #271f12;
      --hairline:       rgba(255,255,255,0.09);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 40px 24px 56px;
  }

  .wrap { max-width: 1280px; margin: 0 auto; }

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 28px;
  }

  .header h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .header .updated { font-size: 12.5px; color: var(--text-muted); }

  .tile-row { display: flex; flex-wrap: wrap; gap: 14px; }

  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-top: 3px solid var(--gridline);
    border-radius: 12px;
    padding: 18px 20px 20px;
    flex: 1 1 150px;
    min-width: 150px;
  }

  .tile .label {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    line-height: 1.3;
    display: flex;
    align-items: center;
  }

  .tile .value {
    font-size: 38px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
    line-height: 1;
  }

  .tile .note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

  .swatch {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
    flex: none;
  }

  /* Names behind a tile's number */
  .people {
    margin-top: 14px;
    border-top: 1px solid var(--hairline);
    padding-top: 10px;
  }
  .people:empty { display: none; }

  /* The name gets the full width of the tile and the time sits under it.
     These tiles are narrow once embedded in Notion, and putting both on one
     line squeezed names down to "Lour…" while the time kept its full width. */
  .person {
    padding: 4px 0;
    font-size: 12px;
    line-height: 1.35;
  }

  .person .who {
    display: block;
    color: var(--text-primary);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  a.who:hover { text-decoration: underline; }

  .person .when {
    display: block;
    color: var(--text-muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }

  .more {
    margin-top: 6px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--text-muted);
    font-size: 11.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .more:hover { color: var(--text-secondary); }

  footer {
    margin-top: 32px;
    padding-top: 14px;
    border-top: 1px solid var(--gridline);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .error-banner {
    display: none;
    background: var(--tile-critical-bg);
    border: 1px solid var(--status-critical);
    color: var(--status-critical);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (max-width: 720px) {
    .tile { flex: 1 1 45%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>FA26 Pipeline Overview</h1>
      <div class="updated" id="updated-label">Loading&hellip;</div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="tile-row">
      <div class="tile" style="background:var(--tile-aqua-bg);border-top-color:var(--accent-aqua);">
        <div class="label"><span class="swatch" style="background:var(--accent-aqua);"></span>New applications this week</div>
        <div class="value" id="v-new">&mdash;</div>
        <div class="note" id="week-range">&mdash;</div>
        <div class="note" id="last-week-note">&mdash;</div>
      </div>

      <div class="tile" style="background:var(--tile-warn-bg);border-top-color:var(--accent-orange);">
        <div class="label"><span class="swatch" style="background:var(--accent-orange);"></span>Left to review</div>
        <div class="value" id="v-review">&mdash;</div>
        <div class="note">Awaiting Anurat's first call</div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-350);">
        <div class="label">Upcoming 1st interview</div>
        <div class="value" id="v-up1">&mdash;</div>
        <div class="people" id="p-up1"></div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-450);">
        <div class="label">Upcoming 2nd interview</div>
        <div class="value" id="v-up2">&mdash;</div>
        <div class="people" id="p-up2"></div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-550);">
        <div class="label">Post 2nd interview &mdash; to decide</div>
        <div class="value" id="v-post2">&mdash;</div>
        <div class="people" id="p-post2"></div>
      </div>

      <div class="tile" style="background:var(--tile-good-bg);border-top-color:var(--status-good);">
        <div class="label"><span class="swatch" style="background:var(--status-good);"></span>Accepted</div>
        <div class="value" id="v-accepted">&mdash;</div>
        <div class="people" id="p-accepted"></div>
      </div>

      <div class="tile" style="background:var(--tile-waitlist-bg);border-top-color:var(--status-waitlist);">
        <div class="label"><span class="swatch" style="background:var(--status-waitlist);"></span>Waitlisted</div>
        <div class="value" id="v-waitlist">&mdash;</div>
        <div class="people" id="p-waitlist"></div>
      </div>
    </div>

    <footer>
      Data pulled live from Airtable &middot; Dealflow base
    </footer>
  </div>

<script>
  var VISIBLE_NAMES = 4;          // names shown before the "+N more" toggle
  var REFRESH_MS = 5 * 60 * 1000; // auto-refresh every 5 minutes

  function mondayOfThisWeek() {
    var now = new Date();
    var day = now.getDay();
    var diffToMonday = (day === 0 ? -6 : 1 - day);
    var monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    return monday;
  }

  function formatMondayFriday() {
    var now = new Date();
    var monday = mondayOfThisWeek();
    var friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    var opts = { month: 'short', day: 'numeric', year: 'numeric' };
    var rangeFmt = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
      ' – ' + friday.toLocaleDateString('en-US', opts);
    if (now < friday) { rangeFmt += ' (so far)'; }
    return rangeFmt;
  }

  // Short "Aug 31–Sep 4" style label for the previous Monday–Friday, used in
  // the "vs __ last week" note so Monday mornings (when this week is always
  // near 0) still show useful context.
  function formatLastWeekMondayFriday() {
    var thisMonday = mondayOfThisWeek();
    var lastMonday = new Date(thisMonday);
    lastMonday.setDate(thisMonday.getDate() - 7);
    var lastFriday = new Date(lastMonday);
    lastFriday.setDate(lastMonday.getDate() + 4);
    var opts = { month: 'short', day: 'numeric' };
    return lastMonday.toLocaleDateString('en-US', opts) +
      '–' + lastFriday.toLocaleDateString('en-US', opts);
  }

  // "Today 17:00", "Tomorrow 09:30", otherwise "Wed 15 Oct, 09:30" — all in
  // Paris time, since that's the time everyone books against.
  function formatWhen(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';

    var tz = { timeZone: 'Europe/Paris' };
    function parisDayKey(date) {
      return date.toLocaleDateString('en-CA', tz); // YYYY-MM-DD
    }

    var now = new Date();
    var tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
    var time = d.toLocaleTimeString('en-GB', {
      timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit'
    });

    if (parisDayKey(d) === parisDayKey(now)) return 'Today ' + time;
    if (parisDayKey(d) === parisDayKey(tomorrow)) return 'Tomorrow ' + time;

    var day = d.toLocaleDateString('en-GB', {
      timeZone: 'Europe/Paris', day: 'numeric', month: 'short'
    });
    return day + ', ' + time;
  }

  // The right-hand label on a name row. Interview tiles carry a scheduled
  // date; the waitlist carries the Elo score, since that's how the list is
  // ranked and worked through.
  function rowLabel(person) {
    if (person.when) return formatWhen(person.when);
    if (person.elo !== undefined && person.elo !== null) return 'Elo ' + person.elo;
    return '';
  }

  // Renders a list of people into a tile. Shows VISIBLE_NAMES, then a
  // "+N more" button that expands the rest in place.
  function renderPeople(containerId, list) {
    var box = document.getElementById(containerId);
    if (!box) return;
    box.innerHTML = '';
    if (!list || !list.length) return;

    var expanded = false;

    function row(person) {
      var el = document.createElement('div');
      el.className = 'person';

      var who;
      if (person.linkedin) {
        who = document.createElement('a');
        who.className = 'who';
        who.href = person.linkedin;
        who.target = '_blank';
        who.rel = 'noopener noreferrer';
      } else {
        who = document.createElement('span');
        who.className = 'who';
      }
      who.textContent = person.name;
      el.appendChild(who);

      var label = rowLabel(person);
      if (label) {
        var w = document.createElement('span');
        w.className = 'when';
        w.textContent = label;
        el.appendChild(w);
      }
      return el;
    }

    function draw() {
      box.innerHTML = '';
      var shown = expanded ? list : list.slice(0, VISIBLE_NAMES);
      shown.forEach(function (p) { box.appendChild(row(p)); });

      var hidden = list.length - VISIBLE_NAMES;
      if (hidden > 0) {
        var btn = document.createElement('button');
        btn.className = 'more';
        btn.type = 'button';
        btn.textContent = expanded ? 'show less' : '+' + hidden + ' more';
        btn.addEventListener('click', function () { expanded = !expanded; draw(); });
        box.appendChild(btn);
      }
    }

    draw();
  }

  function loadDashboard() {
    document.getElementById('week-range').textContent = formatMondayFriday();

    fetch('/api/dashboard')
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || 'Request failed'); });
        return r.json();
      })
      .then(function (data) {
        document.getElementById('v-new').textContent = data.newThisWeek;
        document.getElementById('last-week-note').textContent =
          'vs ' + data.lastWeek + ' last week (' + formatLastWeekMondayFriday() + ')';
        document.getElementById('v-review').textContent = data.leftToReview;
        document.getElementById('v-up1').textContent = data.upcoming1st;
        document.getElementById('v-up2').textContent = data.upcoming2nd;
        document.getElementById('v-post2').textContent = data.post2ndDecide;
        document.getElementById('v-accepted').textContent = data.accepted;
        document.getElementById('v-waitlist').textContent = data.waitlisted;

        var people = data.people || {};
        renderPeople('p-up1', people.upcoming1st);
        renderPeople('p-up2', people.upcoming2nd);
        renderPeople('p-post2', people.post2ndDecide);
        renderPeople('p-accepted', people.accepted);
        renderPeople('p-waitlist', people.waitlisted);

        var banner = document.getElementById('error-banner');
        banner.style.display = 'none';

        var updated = new Date(data.updatedAt);
        document.getElementById('updated-label').textContent =
          'Last updated ' + updated.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
          ' · ' + updated.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      })
      .catch(function (err) {
        var banner = document.getElementById('error-banner');
        banner.style.display = 'block';
        banner.textContent = 'Could not load live data: ' + err.message;
        document.getElementById('updated-label').textContent = 'Load failed';
      });
  }

  loadDashboard();
  setInterval(loadDashboard, REFRESH_MS);
</script>
</body>
</html>
