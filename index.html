<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA26 Pipeline Overview</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --accent-aqua:    #1baf7a;
    --accent-orange:  #eb6834;
    --status-good:      #0ca30c;
    --status-good-text: #006300;
    --status-critical:  #d03b3b;
    --seq-350: #5598e7;
    --seq-450: #2a78d6;
    --seq-550: #1c5cab;
    --tile-good-bg:     #eafaea;
    --tile-critical-bg: #fceeee;
    --tile-aqua-bg:     #e9f9f2;
    --tile-warn-bg:     #fdf1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --accent-aqua:    #199e70;
      --accent-orange:  #d95926;
      --status-good:      #0ca30c;
      --status-good-text: #0ca30c;
      --status-critical:  #e66767;
      --seq-350: #256abf;
      --seq-450: #3987e5;
      --seq-550: #5598e7;
      --tile-good-bg:     #14231a;
      --tile-critical-bg: #2a1c1c;
      --tile-aqua-bg:     #12241c;
      --tile-warn-bg:     #2a2016;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 40px 24px 56px;
  }

  .wrap { max-width: 1280px; margin: 0 auto; }

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 28px;
  }

  .header h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .header .updated { font-size: 12.5px; color: var(--text-muted); }

  .tile-row { display: flex; flex-wrap: wrap; gap: 14px; }

  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-top: 3px solid var(--gridline);
    border-radius: 12px;
    padding: 18px 20px 20px;
    flex: 1 1 150px;
    min-width: 150px;
  }

  .tile .label {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    line-height: 1.3;
    display: flex;
    align-items: center;
  }

  .tile .value {
    font-size: 38px;
    font-weight: 600;
    font-variant-numeric: proportional-nums;
    line-height: 1;
  }

  .tile .note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

  .swatch {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    margin-right: 6px;
    flex: none;
  }

  footer {
    margin-top: 32px;
    padding-top: 14px;
    border-top: 1px solid var(--gridline);
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .error-banner {
    display: none;
    background: var(--tile-critical-bg);
    border: 1px solid var(--status-critical);
    color: var(--status-critical);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }

  @media (max-width: 720px) {
    .tile { flex: 1 1 45%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>FA26 Pipeline Overview</h1>
      <div class="updated" id="updated-label">Loading&hellip;</div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <div class="tile-row">
      <div class="tile" style="background:var(--tile-aqua-bg);border-top-color:var(--accent-aqua);">
        <div class="label"><span class="swatch" style="background:var(--accent-aqua);"></span>New applications this week</div>
        <div class="value" id="v-new">&mdash;</div>
        <div class="note" id="week-range">&mdash;</div>
      </div>

      <div class="tile" style="background:var(--tile-warn-bg);border-top-color:var(--accent-orange);">
        <div class="label"><span class="swatch" style="background:var(--accent-orange);"></span>Left to review</div>
        <div class="value" id="v-review">&mdash;</div>
        <div class="note">Awaiting Anurat's first call</div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-350);">
        <div class="label">Upcoming 1st interview</div>
        <div class="value" id="v-up1">&mdash;</div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-450);">
        <div class="label">Upcoming 2nd interview</div>
        <div class="value" id="v-up2">&mdash;</div>
      </div>

      <div class="tile" style="border-top-color:var(--seq-550);">
        <div class="label">Post 2nd interview &mdash; to decide</div>
        <div class="value" id="v-post2">&mdash;</div>
      </div>

      <div class="tile" style="background:var(--tile-good-bg);border-top-color:var(--status-good);">
        <div class="label"><span class="swatch" style="background:var(--status-good);"></span>To accept</div>
        <div class="value" id="v-accept">&mdash;</div>
      </div>

      <div class="tile" style="background:var(--tile-critical-bg);border-top-color:var(--status-critical);">
        <div class="label"><span class="swatch" style="background:var(--status-critical);"></span>To reject</div>
        <div class="value" id="v-reject">&mdash;</div>
      </div>
    </div>

    <footer>
      Data pulled live from Airtable &middot; Dealflow base
    </footer>
  </div>

<script>
  function formatMondayFriday() {
    var now = new Date();
    var day = now.getDay();
    var diffToMonday = (day === 0 ? -6 : 1 - day);
    var monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    var friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    var opts = { month: 'short', day: 'numeric', year: 'numeric' };
    var rangeFmt = monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
      ' – ' + friday.toLocaleDateString('en-US', opts);
    if (now < friday) { rangeFmt += ' (so far)'; }
    return rangeFmt;
  }

  var REFRESH_MS = 5 * 60 * 1000; // auto-refresh every 5 minutes

  function loadDashboard() {
    document.getElementById('week-range').textContent = formatMondayFriday();

    fetch('/api/dashboard')
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || 'Request failed'); });
        return r.json();
      })
      .then(function (data) {
        document.getElementById('v-new').textContent = data.newThisWeek;
        document.getElementById('v-review').textContent = data.leftToReview;
        document.getElementById('v-up1').textContent = data.upcoming1st;
        document.getElementById('v-up2').textContent = data.upcoming2nd;
        document.getElementById('v-post2').textContent = data.post2ndDecide;
        document.getElementById('v-accept').textContent = data.toAccept;
        document.getElementById('v-reject').textContent = data.toReject;

        var banner = document.getElementById('error-banner');
        banner.style.display = 'none';

        var updated = new Date(data.updatedAt);
        document.getElementById('updated-label').textContent =
          'Last updated ' + updated.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) +
          ' · ' + updated.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      })
      .catch(function (err) {
        var banner = document.getElementById('error-banner');
        banner.style.display = 'block';
        banner.textContent = 'Could not load live data: ' + err.message;
        document.getElementById('updated-label').textContent = 'Load failed';
      });
  }

  loadDashboard();
  setInterval(loadDashboard, REFRESH_MS);
</script>
</body>
</html>
